# Archfit: check this change and send the result to the Archfit App at
# https://app.coupling.dev, which decides the archfit/gate check.
name: archfit
on:
  pull_request:
  push:
    branches:
      - "main"
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  id-token: write
jobs:
  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: alexei-led/archfit-action@9669571b7b25e3f37fd7f1d99d7b89741c6c95d6 # v4.0.0
        with:
          endpoint: "https://app.coupling.dev"
          audience: "https://app.coupling.dev"
