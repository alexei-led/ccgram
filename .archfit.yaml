rules:
  - id: no-handlers-to-tmux
    note: No dependency from src/ccgram/handlers**/__init__.py to src/ccgram/multiplexer/tmux.py.
    why: A handler that imports a concrete multiplexer backend ties message handling to that one backend; callers go through the neutral ccgram.multiplexer proxy, so a backend can change without touching them.
  - id: no-handlers-to-herdr
    note: No dependency from src/ccgram/handlers**/__init__.py to src/ccgram/multiplexer/herdr.py.
    why: A handler that imports a concrete multiplexer backend ties message handling to that one backend; callers go through the neutral ccgram.multiplexer proxy, so a backend can change without touching them.
  - id: no-handlers-to-mux-registry
    note: No dependency from src/ccgram/handlers**/__init__.py to src/ccgram/multiplexer/registry.py.
    why: A handler that imports a concrete multiplexer backend ties message handling to that one backend; callers go through the neutral ccgram.multiplexer proxy, so a backend can change without touching them.
  - id: no-providers-to-tmux
    note: No dependency from src/ccgram/providers**/__init__.py to src/ccgram/multiplexer/tmux.py.
    why: A provider that imports a concrete multiplexer backend ties provider logic to that one backend; callers go through the neutral ccgram.multiplexer proxy, so a backend can change without touching them.
  - id: no-providers-to-herdr
    note: No dependency from src/ccgram/providers**/__init__.py to src/ccgram/multiplexer/herdr.py.
    why: A provider that imports a concrete multiplexer backend ties provider logic to that one backend; callers go through the neutral ccgram.multiplexer proxy, so a backend can change without touching them.
  - id: no-handlers-to-provider-detection
    note: No dependency from src/ccgram/handlers**/__init__.py to src/ccgram/providers/process_detection.py.
    why: A handler that imports the process classifier reads terminal state itself; handlers learn the foreground process through the detect_provider_from_pane facade.
  - id: no-event-stream-to-handlers
    note: No dependency from src/ccgram/event_stream_monitor.py to src/ccgram/handlers**/__init__.py.
    why: "Push observation that owns message handling stops being neutral: it can no longer be reused or tested without the bot."
  - id: no-event-stream-to-telegram
    note: No dependency from src/ccgram/event_stream_monitor.py to src/ccgram/telegram**.py.
    why: "Push observation that owns Telegram transport stops being neutral: it can no longer be reused or tested without the bot."
  - id: no-event-stream-to-routing
    note: No dependency from src/ccgram/event_stream_monitor.py to src/ccgram/thread_router.py.
    why: "Push observation that owns recipient routing stops being neutral: it can no longer be reused or tested without the bot."
  - id: no-bootstrap-to-polling-implementation
    note: No dependency from src/ccgram/bootstrap.py to src/ccgram/handlers/polling/window_tick**/__init__.py.
    why: Composition that reaches into private polling helpers breaks when they change; it uses the supported adapter entrypoint.
  - id: no-bot-to-main
    note: No dependency from src/ccgram/bot.py to src/ccgram/main.py.
    why: "The bot importing CLI state inverts the dependency: the runner supplies live lifecycle facts to the bot, not the other way round."
