# archfit architecture-drift config for ccgram.
#
# Design notes (2026-06-27 review + current code):
# - VOLATILITY is the coupling lever, not owner. The current design docs record
#   the calibrated book result: declaring subdomain+volatility moved mean book
#   balance 2.9 -> 6.0 and critical edges 387 -> 62. Declaring `owner` left
#   distance unchanged (archfit distance is code_structure-based), so owner is
#   a hygiene label only.
# - `owner: alexei-led` remains declared on every module for hygiene (single
#   owner; silences omit-owner warnings) — NOT to influence coupling.
# - Subdomain/volatility are architect-inferred labels. Current map in docs and
#   config is aligned to the code/tests: core=session/window-state, the shared
#   session protocol, delivery and multiplexer contracts, and handler
#   orchestration; supporting=provider/multiplexer adapters, transcript, Mini
#   App/mobile API, Telegram adapters, and Git-worktree helpers; generic=config,
#   utils, provider detection, and concrete backends.
#   Confirm labels against churn when design changes.
# - The pytest audits are the enforced drift gate. `archfit` is the whole-graph
#   mirror and advisory gate: keep `no-import-cycles` as warn because the repo
#   intentionally uses lazy imports that runtime tests accept.
# - The config below is intended for full scans and delta scans. Keep it aligned
#   with the current package map before running `archfit analyze` or
#   `archfit analyze --base <ref>`.
#
# Solo-developer / distance note (Balanced Coupling):
#   Distance is socio-technical — different-TEAM ownership RAISES it. A single
#   owner adds ZERO ownership distance, so here distance reduces to code
#   structure + runtime. Declaring yourself as owner is correct and honest, but
#   it cannot lower coupling: the only levers are reduce strength (add a
#   contract), reduce structural distance (co-locate), or accept low volatility.
#   Because you personally absorb every cascade, honest `volatility` is the right
#   primary signal — it tells you which couplings will actually bite.
version: 2
languages:
  python:
    package: ccgram
  go:
    enabled: false
  typescript:
    enabled: false
# Minimum severity for BC coupling advisories: low|medium|high|critical
coupling:
  min_severity: medium
  # Inferred-volatility cascade (Balanced Coupling, book Ch9; archfit >=0.8). A
  # stable module that is functional/intrusive-coupled to a `core` module inherits
  # high volatility — it gets dragged into change whenever the core does. This is
  # exactly ccgram's shape: modules wired to the live-session core (session_state,
  # handlers, window_state) co-evolve with it. Enabling this surfaces that inherited
  # volatility instead of under-rating quiet modules wired to a churning core.
  volatility_cascade: true
# Skip non-Python assets from extraction (incl. the jscpd clone scan). Without
# this, font-license text + miniapp JS dominate clone findings as false cohesion
# risk. .gitnexus/.codegraph index dirs are auto-ignored by archfit.
exclude:
  - '**/fonts/**'
  - '**/miniapp/static/**'
  - '**/pkg/mod/**' # stray Go module cache at repo root (untracked cruft; safe to `rm -rf pkg/`)
analyzers:
  scip:
    enabled: true
  syntax:
    enabled: true
  clones:
    enabled: true # jscpd — powers duplication signal (kept honest by exclusions)
ai:
  provider: anthropic
  model: claude-opus-4-8
layers:
  - core
  - adapter
modules:
  # --- Adapter: subpackages ---
  handlers:
    paths:
      - ccgram.handlers
      - ccgram.handlers.*
    layer: adapter
    owner: alexei-led
    subdomain: core # the orchestration that makes ccgram ccgram
    volatility: high
  providers:
    paths:
      - ccgram.providers
      - ccgram.providers.*
    layer: adapter
    owner: alexei-led
    subdomain: supporting # adapters to external agent CLIs
    volatility: medium
  # --- Core: subpackages ---
  hooks:
    paths:
      - ccgram.hooks
      - ccgram.hooks.*
    layer: core
    owner: alexei-led
    subdomain: supporting
    volatility: low
  llm:
    paths:
      - ccgram.llm
      - ccgram.llm.*
    layer: core
    owner: alexei-led
    subdomain: generic # LLM client plumbing
    volatility: low
  miniapp:
    paths:
      - ccgram.miniapp
      - ccgram.miniapp.*
    layer: core
    owner: alexei-led
    subdomain: supporting
    volatility: medium
  tts:
    paths:
      - ccgram.tts
      - ccgram.tts.*
    layer: core
    owner: alexei-led
    subdomain: generic
    volatility: low
  whisper:
    paths:
      - ccgram.whisper
      - ccgram.whisper.*
    layer: core
    owner: alexei-led
    subdomain: generic
    volatility: low
  window_state_ports:
    paths:
      - ccgram.window_state_ports
      - ccgram.window_state_ports.*
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: medium
  # --- Core: live-session read contract ---
  # Mirrors window_state_ports for the volatile session-state cluster.
  # Handlers read frozen LiveSessionSnapshot projections via free functions;
  # direct imports of claude_task_state / get_claude_task_snapshot / idle_tracker
  # from handlers are banned. Write authority stays in session_lifecycle.
  # Fitness gate: tests/ccgram/test_session_state_ports_audit.py.
  session_state_ports:
    paths:
      - ccgram.session_state_ports
      - ccgram.session_state_ports.*
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: medium
  # --- Core: transcript-delivery acknowledgement and checkpoint contract ---
  # A narrow shared contract for transcript producers, queue settlement, and
  # session-monitor persistence; it owns no Telegram, handler, or monitor code.
  # Medium volatility is a design hypothesis: delivery/replay semantics are
  # central and expected to evolve, not a historical churn measurement.
  delivery_contract:
    paths:
      - ccgram.delivery_contract
    public:
      - ccgram.delivery_contract
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: medium
  # --- Core: shared session protocol and live-session service ---
  # The source package also contains telegram.py; that concrete in-process
  # adapter gets a narrower adapter owner below rather than inheriting this core.
  session_protocol:
    paths:
      - ccgram.session_protocol
      - ccgram.session_protocol.*
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: high # design hypothesis: session behavior evolves; protocol/v1 preserves wire compatibility
  # --- Core: session and lifecycle management (the live-session core) ---
  # Highest-fan-in volatile target cluster from the review (claude_task_state,
  # session, session_monitor, monitor_state). The 62 residual critical edges
  # land here — the genuine coupling hotspot, candidate for a read-contract.
  session_state:
    paths:
      - ccgram.session
      - ccgram.session_map
      - ccgram.session_lifecycle
      - ccgram.session_resolver
      - ccgram.session_query
      - ccgram.session_monitor
      - ccgram.topic_state_registry
      - ccgram.claude_task_state
      - ccgram.idle_tracker
      - ccgram.state_persistence
      - ccgram.monitor_events
      - ccgram.monitor_state
      - ccgram.event_stream_monitor # supervises multiplexer.watch_events → agent_status_cache / death
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: high
  # --- Core: window state and queries ---
  window_state:
    paths:
      - ccgram.window_query
      - ccgram.window_resolver
      - ccgram.window_state_store
      - ccgram.window_view
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: medium
  # --- Core: transcript reading and terminal parsing ---
  transcript:
    paths:
      - ccgram.transcript_parser
      - ccgram.transcript_reader
      - ccgram.event_reader
      - ccgram.terminal_parser
      - ccgram.screen_buffer
      - ccgram.last_unit
    layer: core
    owner: alexei-led
    subdomain: supporting # follows external transcript formats
    volatility: medium
  # --- Core: config, shared utilities, and domain formatting ---
  domain_config:
    paths:
      - ccgram
      - ccgram._version
      - ccgram.config
      - ccgram.user_preferences
      - ccgram.toolbar_config
      - ccgram.command_catalog
      - ccgram.utils
      - ccgram.expandable_quote
      - ccgram.tool_format
    layer: core
    owner: alexei-led
    subdomain: generic # stable shared infra (config fan-in ~72)
    volatility: low
  # --- Adapter: Telegram protocol and bot ---
  telegram_adapter:
    paths:
      - ccgram.telegram_client
      - ccgram.telegram_draft
      - ccgram.telegram_request
      - ccgram.telegram_sender
      - ccgram.telegram_rate_limiter
      - ccgram.bot
      - ccgram.cc_commands
      - ccgram.entity_formatting
    layer: adapter
    owner: alexei-led
    subdomain: supporting
    volatility: medium
  # --- Adapter: in-process Telegram facade over the shared session protocol ---
  # Explicit __all__ plus existing handler callers identify its public surface.
  # Supporting/medium is a design hypothesis: the Telegram translation follows
  # UI workflow changes while the shared service contract stays transport-neutral.
  session_protocol_telegram:
    paths:
      - ccgram.session_protocol.telegram
    public:
      - ccgram.session_protocol.telegram
    layer: adapter
    owner: alexei-led
    subdomain: supporting
    volatility: medium
  # --- Adapter: authenticated ccgram/1 HTTP and WebSocket transport ---
  # The wire contract lives in protocol/v1; no in-tree caller uses the package
  # re-exports, so do not label them as a public Python import boundary.
  # Supporting/medium is a design hypothesis for a separate client transport
  # whose security and wire evolution do not redefine the session core.
  api:
    paths:
      - ccgram.api
      - ccgram.api.*
    layer: adapter
    owner: alexei-led
    subdomain: supporting
    volatility: medium
  # --- Core: multiplexer contract (pure Protocol + value types) ---
  # The backend-neutral seam callers depend on. Generic subdomain; functional
  # volatility low, implementation volatility medium (one backend became two;
  # herdr is young). Public paths name exact module-level contracts supported
  # by source documentation and cross-component callers; backend-specific
  # implementations remain private.
  # Persisted Herdr target validation belongs here as a shared identity
  # contract, not in adapter implementation code. `base` importing no backend
  # is the F3 core-purity audit (test_import_no_cycles); the proxy's wiring
  # import of `registry` is the seam's sanctioned job (F1 exempts
  # `multiplexer/**`).
  multiplexer:
    paths:
      - ccgram.multiplexer # proxy facade (neutral)
      - ccgram.multiplexer.base # Protocol + capabilities + value types
      - ccgram.multiplexer.vim_state
      - ccgram.multiplexer.window_ops
      - ccgram.multiplexer.self_identify
      - ccgram.multiplexer.agent_status_cache # backend-neutral push-status cache (mirrors vim_state)
      - ccgram.multiplexer.topic_mapping # backend-neutral window→topic projection helper
      - ccgram.multiplexer.reconciliation # confirmed/unknown cross-backend presence contract
      - ccgram.multiplexer.window_liveness # neutral liveness state for queued delivery
      - ccgram.herdr_targets # persisted target-namespace contract shared with session state
    public:
      - ccgram.multiplexer
      - ccgram.multiplexer.base
      - ccgram.multiplexer.reconciliation
      - ccgram.multiplexer.window_liveness
      - ccgram.herdr_targets
    layer: core
    owner: alexei-led
    subdomain: generic
    volatility: low # functional; implementation medium (two backends)
  # --- Adapter: concrete multiplexer backends and private support ---
  # Herdr socket/JSON and tmux/libtmux details stay here. Feature code uses the
  # neutral proxy/base; the detached hook's direct imports of agterm_panes and
  # herdr_socket are narrow standalone-hook support. The F1 pytest audit
  # prohibits direct concrete-backend imports from non-exempt code, and the
  # forbidden-dependency rules below mirror selected high-risk edges. These
  # backends also own foreground/tty internals: tmux alone reads `pane_tty` +
  # `ps -t`, exposed solely through `Multiplexer.foreground()` (see the
  # `test_no_tty_outside_backend.py` audit).
  multiplexer_backends:
    paths:
      - ccgram.multiplexer.tmux
      - ccgram.multiplexer.herdr
      - ccgram.multiplexer.herdr_events # herdr-only unix-socket event-stream reader
      - ccgram.multiplexer.agterm
      - ccgram.multiplexer.agterm_panes # private agterm split-pane projections
      - ccgram.multiplexer.herdr_commands # manager CLI to Herdr JSON-RPC translation
      - ccgram.multiplexer.herdr_socket # bounded Herdr socket transport
      - ccgram.multiplexer.registry
    layer: adapter
    owner: alexei-led
    subdomain: generic
    volatility: medium # implementation: herdr protocol / id scheme may change
  # --- Adapter: provider-detection classifier (foreground -> provider name) ---
  # The backend-neutral half of foreground detection. `process_detection` only
  # classifies a neutral `ForegroundInfo.argv` it receives from
  # `Multiplexer.foreground()` — no tty, no `ps`. The sanctioned consumer is the
  # providers facade (`detect_provider_from_pane`); handlers must route through
  # that facade, not import the classifier internals (no-tty drift gate below).
  provider_detection:
    paths:
      - ccgram.providers.process_detection
    layer: adapter
    owner: alexei-led
    subdomain: generic
    volatility: low
  # --- Adapter: terminal infrastructure ---
  terminal_adapter:
    paths:
      - ccgram.thread_router
      - ccgram.screenshot
    layer: adapter
    owner: alexei-led
    subdomain: supporting
    volatility: low
  # --- Adapter: host Git worktree provisioning ---
  # Shared API used by the session creation backend and Telegram's directory
  # flow; the module documents its narrow helper surface and both callers import
  # it directly. Supporting/medium is a design hypothesis for host-Git plumbing
  # that can evolve with worktree creation behavior, not a churn measurement.
  worktrees:
    paths:
      - ccgram.worktrees
    public:
      - ccgram.worktrees
    layer: adapter
    owner: alexei-led
    subdomain: supporting
    volatility: medium
  # --- Adapter: application entry points and CLI ---
  app_bootstrap:
    paths:
      - ccgram.main
      - ccgram.cli
      - ccgram.bootstrap
      - ccgram.doctor_cmd
      - ccgram.status_cmd
      - ccgram.hook
    layer: adapter
    owner: alexei-led
    subdomain: generic # composition root / wiring
    volatility: low
rules:
  # IMPORTANT — forbidden_dependency `from`/`to` are PATH GLOBS (e.g.
  # `ccgram.handlers**`), NOT module-group names. Using a module name (`handlers`)
  # silently matches nothing and the rule never fires.
  # The pytest test_multiplexer_boundary audit stays the COMPREHENSIVE in-process
  # gate (all callers, both import forms, allow-list); these glob rules mirror the
  # highest-risk source->backend edges as a fast archfit drift signal.
  #
  # Multiplexer seam: no caller may import a concrete backend (tmux/herdr/registry);
  # callers go through the neutral `ccgram.multiplexer` proxy / `.base` contract.
  - id: no-handlers-to-tmux
    type: forbidden_dependency
    from: ccgram.handlers**
    to: ccgram.multiplexer.tmux
    gate: fail
  - id: no-handlers-to-herdr
    type: forbidden_dependency
    from: ccgram.handlers**
    to: ccgram.multiplexer.herdr
    gate: fail
  - id: no-handlers-to-mux-registry
    type: forbidden_dependency
    from: ccgram.handlers**
    to: ccgram.multiplexer.registry
    gate: fail
  - id: no-providers-to-tmux
    type: forbidden_dependency
    from: ccgram.providers**
    to: ccgram.multiplexer.tmux
    gate: fail
  - id: no-providers-to-herdr
    type: forbidden_dependency
    from: ccgram.providers**
    to: ccgram.multiplexer.herdr
    gate: fail
  # No-tty drift gate: handlers learn the foreground process through the
  # `detect_provider_from_pane` facade, never by importing the classifier
  # directly. Mirrors the pytest test_no_tty_outside_backend audit.
  - id: no-handlers-to-provider-detection
    type: forbidden_dependency
    from: ccgram.handlers**
    to: ccgram.providers.process_detection
    gate: fail
  # Advisory (see header): archfit counts lazy/in-function imports as cycle
  # edges; the runtime gate is the clean-interpreter test_import_no_cycles.
  - id: no-import-cycles
    type: cycle
    gate: warn
